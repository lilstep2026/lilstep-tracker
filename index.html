<!DOCTYPE html>
<html lang="en">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LilStep — Finance, Inventory & Order Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<style>
:root{
  --ink:#2A211B;
  --ink-soft:#6b5d52;
  --paper:#FBF5EA;
  --paper-2:#F3E9D7;
  --card:#FFFDF8;
  --sidebar:#241C17;
  --sidebar-soft:#B8A891;
  --clay:#BD5B34;
  --clay-dark:#9C4726;
  --sage:#5E7C55;
  --sage-bg:#E7EEE1;
  --rose:#A73B45;
  --rose-bg:#F4E2E1;
  --ochre:#B8862E;
  --ochre-bg:#F3E7CE;
  --ink-blue:#3A5170;
  --blue-bg:#E4EAF1;
  --line:#E4D8C3;
  --radius:14px;
  --shadow: 0 1px 2px rgba(42,33,27,.06), 0 8px 24px -12px rgba(42,33,27,.18);
  --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:'IBM Plex Mono', 'SF Mono', Consolas, monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--clay);color:#fff;}
.app{display:flex;min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:230px;flex-shrink:0;background:var(--sidebar);color:var(--sidebar-soft);
  display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 22px;}
.brand-mark{width:34px;height:34px;flex-shrink:0;}
.brand-name{font-family:var(--font-display);font-weight:600;font-size:19px;color:#F6EFE2;letter-spacing:.2px;}
.brand-sub{font-size:10.5px;color:var(--sidebar-soft);letter-spacing:.06em;text-transform:uppercase;margin-top:1px;}
nav.tabs{display:flex;flex-direction:column;gap:3px;margin-top:6px;}
.tab-btn{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--sidebar-soft);
  background:transparent;border:none;font-family:var(--font-body);font-size:14px;font-weight:500;cursor:pointer;text-align:left;
  transition:background .15s, color .15s;
}
.tab-btn svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
.tab-btn:hover{background:rgba(255,255,255,.06);color:#F6EFE2;}
.tab-btn.active{background:var(--clay);color:#fff;}
.tab-btn.active svg{opacity:1;}
.sidebar-foot{margin-top:auto;padding:14px 10px 4px;font-size:11px;color:#7d6c5c;line-height:1.5;border-top:1px dashed #493a2f;}

/* ---------- Main ---------- */
main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:5;background:rgba(251,245,234,.9);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.balance-chip{
  display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:8px 16px;box-shadow:var(--shadow);
}
.balance-chip .lbl{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;}
.balance-chip .val{font-family:var(--font-mono);font-size:19px;font-weight:600;color:var(--clay-dark);}
.topbar-title{font-family:var(--font-display);font-size:18px;font-weight:600;flex:1;min-width:120px;}
.top-actions{display:flex;gap:8px;}
.btn{
  font-family:var(--font-body);font-size:13px;font-weight:600;border-radius:9px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);padding:8px 14px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:var(--clay);color:var(--clay-dark);}
.btn.primary{background:var(--clay);border-color:var(--clay);color:#fff;}
.btn.primary:hover{background:var(--clay-dark);color:#fff;}
.btn.ghost{background:transparent;box-shadow:none;}
.btn.small{padding:5px 10px;font-size:12px;}
.btn.danger:hover{border-color:var(--rose);color:var(--rose);}

.content{padding:24px 28px 60px;}
.panel{display:none;}
.panel.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* stitched divider — signature element */
.stitch{
  height:14px;margin:26px 0;background-image:radial-gradient(circle, var(--line) 1.4px, transparent 1.6px);
  background-size:11px 11px;background-position:center;opacity:.9;
}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.section-head h2{font-family:var(--font-display);font-size:22px;font-weight:600;margin:0;}
.section-head p{font-size:13px;color:var(--ink-soft);margin:3px 0 0;max-width:560px;}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;}
.grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px;box-shadow:var(--shadow);}
.kpi .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:6px;}
.kpi .val{font-family:var(--font-mono);font-size:23px;font-weight:600;}
.kpi .sub{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}
.kpi.pos .val{color:var(--sage);}
.kpi.neg .val{color:var(--rose);}

table{width:100%;border-collapse:collapse;font-size:13px;}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);}
th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);
  background:var(--paper-2);padding:10px 12px;white-space:nowrap;border-bottom:1px solid var(--line);position:sticky;top:0;
}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FCF7EC;}
td.num, th.num{font-family:var(--font-mono);text-align:right;font-variant-numeric:tabular-nums;}
tr.total-row td{font-weight:700;background:var(--paper-2);}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;}
.badge.delivered{background:var(--sage-bg);color:var(--sage);}
.badge.rto{background:var(--rose-bg);color:var(--rose);}
.badge.cancelled{background:#EDE7DD;color:#8a7a68;}
.badge.transit{background:var(--blue-bg);color:var(--ink-blue);}
.badge.good{background:var(--sage-bg);color:var(--sage);}
.badge.watch{background:var(--ochre-bg);color:var(--ochre);}
.badge.needs{background:var(--rose-bg);color:var(--rose);}
.badge.locked{background:var(--blue-bg);color:var(--ink-blue);}
.badge.unfulfilled{background:var(--ochre-bg);color:var(--ochre);}
.row-actions{display:flex;gap:6px;}
.icon-btn{background:none;border:none;cursor:pointer;padding:4px;color:var(--ink-soft);border-radius:6px;}
.icon-btn:hover{color:var(--clay);background:var(--paper-2);}
.icon-btn svg{width:15px;height:15px;}
.empty{padding:34px 20px;text-align:center;color:var(--ink-soft);font-size:13.5px;}

.chart-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:20px;}
.chart-card h3{font-family:var(--font-display);margin:0 0 12px;font-size:16px;font-weight:600;}
canvas{max-height:280px;}

.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;}
@media (max-width:960px){.two-col{grid-template-columns:1fr;}}

.assump-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:12px;font-weight:600;color:var(--ink-soft);}
.field input,.field select{
  font-family:var(--font-mono);font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);
}
.field input:focus,.field select:focus{outline:none;border-color:var(--clay);}
.hint{font-size:12px;color:var(--ink-soft);margin-top:4px;}
.callout{background:var(--ochre-bg);border:1px solid #e2caa0;border-radius:12px;padding:14px 16px;font-size:13px;color:#6b4f16;margin-bottom:20px;}
.callout b{color:var(--clay-dark);}
.callout.sage{background:var(--sage-bg);border-color:#c7d8bd;color:#3d5236;}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(36,28,23,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:5vh 16px;overflow-y:auto;}
.overlay.show{display:flex;}
.modal{background:var(--card);border-radius:16px;max-width:560px;width:100%;padding:24px 26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal h3{font-family:var(--font-display);margin:0 0 4px;font-size:19px;}
.modal .modal-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-grid .full{grid-column:1/-1;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#F6EFE2;padding:10px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);z-index:80;opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

.mobile-nav{display:none;}
@media (max-width:840px){
  .sidebar{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;flex-direction:row;overflow-x:auto;padding:8px;z-index:40;}
  .brand,.sidebar-foot{display:none;}
  nav.tabs{flex-direction:row;gap:4px;}
  .tab-btn span{display:none;}
  .tab-btn{padding:10px;}
  main{padding-bottom:70px;}
  .content{padding:18px 14px 90px;}
  .topbar{padding:12px 14px;}
  .form-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="19" fill="#BD5B34"/>
        <path d="M14 26c0-5 2-9 6-9s6 4 6 9" stroke="#F6EFE2" stroke-width="2" stroke-linecap="round"/>
        <circle cx="15.5" cy="14.5" r="2.1" fill="#F6EFE2"/>
        <circle cx="20.5" cy="12.5" r="2.1" fill="#F6EFE2"/>
        <circle cx="25.2" cy="14.8" r="2.1" fill="#F6EFE2"/>
      </svg>
      <div>
        <div class="brand-name">LilStep</div>
        <div class="brand-sub">Finance Ledger</div>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="sidebar-foot">Data lives in this browser tab only.<br>Export often to keep a copy.</div>
  </aside>

  <main>
    <div class="topbar">
      <div class="topbar-title" id="topTitle">Dashboard</div>

        <span class="lbl">Bank balance</span>
        <span class="val" id="topBalance">₹0</span>
      </div>
      <div class="top-actions">
        <button class="btn" id="btnImport">Import JSON</button>
        <button class="btn" id="btnExport">Export JSON</button>
        <input type="file" id="fileImport" accept="application/json" style="display:none">
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalBox"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= ICONS ================= */
const ICON = {
  dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="11" width="8" height="10" rx="1.5"/><rect x="3" y="14" width="8" height="7" rx="1.5"/></svg>',
  orders:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l3 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M9 10h6M9 14h6"/></svg>',
  products:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',
  inventory:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="14" rx="1.5"/><path d="M3 7l2-4h14l2 4"/><path d="M9 11h6"/></svg>',
  bank:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10l9-6 9 6"/><path d="M5 10v9M10 10v9M14 10v9M19 10v9"/><path d="M3 21h18"/></svg>',
  expenses:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v18M6 7h9a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h9"/></svg>',
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15 1.65 1.65 0 0 0 3.17 14H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.36.4.66.73.85.24.14.5.23.78.24H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>'
};

/* ================= STATE ================= */
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

function seedState(){
  const p = (name,price,mat,pack,other,notes)=>({id:uid(),name,price,material:mat,packaging:pack,other,notes:notes||''});
  const products = [
    p('Clay Handprint & Footprint Keepsake Kit',899,180,90,20,'Core LilStep product'),
    p('12-Month Baby Milestone Magazine',699,140,60,15,''),
    p('Floral Footprint Art Kit — Soft Blush Garden',1099,220,100,25,'Real pressed daisies, seasonal sourcing'),
    p('Waterproof Baby Ear Covers (Pack of 2)',449,95,35,10,'')
  ];
  const byName=n=>products.find(x=>x.name===n).id;
  const assumptions = {gatewayFeePct:2, gstPct:18, codFeePct:2, rtoMultiplier:2, defaultAdvance:100, refundAdvanceOnRTO:false};
  const snap = (prodName)=>{
    const prod = products.find(x=>x.name===prodName);
    return {priceSnap:prod.price, materialSnap:prod.material, packagingSnap:prod.packaging, otherSnap:prod.other,
      gatewayFeePctSnap:assumptions.gatewayFeePct, gstPctSnap:assumptions.gstPct, codFeePctSnap:assumptions.codFeePct, rtoMultiplierSnap:assumptions.rtoMultiplier};
  };
  const orders = [
    {id:uid(),date:'2026-06-02',orderId:'LS1001',customer:'Priya Sharma',productId:byName('Clay Handprint & Footprint Keepsake Kit'),qty:1,discount:0,shipping:60,paymentMode:'Prepaid',advance:0,courierCost:70,status:'Delivered',...snap('Clay Handprint & Footprint Keepsake Kit')},
    {id:uid(),date:'2026-06-04',orderId:'LS1002',customer:'Anjali Mehta',productId:byName('Floral Footprint Art Kit — Soft Blush Garden'),qty:1,discount:50,shipping:0,paymentMode:'COD',advance:100,courierCost:95,status:'RTO',...snap('Floral Footprint Art Kit — Soft Blush Garden')},
    {id:uid(),date:'2026-06-06',orderId:'LS1003',customer:'Ritu Verma',productId:byName('Waterproof Baby Ear Covers (Pack of 2)'),qty:2,discount:0,shipping:40,paymentMode:'COD',advance:100,courierCost:70,status:'Delivered',...snap('Waterproof Baby Ear Covers (Pack of 2)')},
    {id:uid(),date:'2026-06-09',orderId:'LS1004',customer:'Sneha Kapoor',productId:byName('12-Month Baby Milestone Magazine'),qty:1,discount:0,shipping:0,paymentMode:'COD',advance:100,courierCost:0,status:'Cancelled',...snap('12-Month Baby Milestone Magazine')}
  ];
  const inventory = [
    {id:uid(),date:'2026-06-03',item:'Air-dry Clay (White)',supplier:'Local Bhilwara Supplier',qty:25,unit:'kg',unitCost:220,notes:'Bulk restock'},
    {id:uid(),date:'2026-06-05',item:'Kraft Packaging Box - Small',supplier:'Surat Packaging Co.',qty:500,unit:'pcs',unitCost:14,notes:'Restock for June-July'},
    {id:uid(),date:'2026-06-08',item:'Pressed Daisies (Dried)',supplier:'Jaipur Phool Mandi',qty:2000,unit:'pcs',unitCost:3.5,notes:'Seasonal stock - Oct-Mar window'}
  ];
  const bank = {opening:50000, entries:[
    {id:uid(),date:'2026-06-01',description:'Opening cash carried forward',category:'Other',in:0,out:0},
    {id:uid(),date:'2026-06-02',description:'Advance received - Order LS1001',category:'Order Advance (Gateway)',in:62,out:0},
    {id:uid(),date:'2026-06-05',description:'Bulk clay + packaging purchase',category:'Stock Purchase',in:0,out:5960},
    {id:uid(),date:'2026-06-10',description:'COD remittance from courier (batch)',category:'COD Remittance from Courier',in:8400,out:0},
    {id:uid(),date:'2026-06-15',description:'Meta ads payment',category:'Expense Payment',in:0,out:8500}
  ]};
  const expenses = [
    {id:uid(),date:'2026-06-05',month:'Jun-2026',category:'Marketing/Ads',amount:8500,notes:'June campaign - LilStep'},
    {id:uid(),date:'2026-06-10',month:'Jun-2026',category:'Packaging Bulk Purchase',amount:0,notes:'Moved to Inventory & Stock sheet'},
    {id:uid(),date:'2026-06-15',month:'Jun-2026',category:'Software/Subscriptions',amount:1999,notes:'Shopify plan'}
  ];
  return {products,orders,inventory,bank,expenses,assumptions};
}

let state = seedState();
let activeTab = 'dashboard';

/* ================= MIGRATION: lock historical orders to the cost/fee rates that
   were in effect when they were saved, so later edits to Product Master or
   Settings never silently change already-recorded profit numbers. ================= */
function migrateOrderSnapshots(){
  let changed = false;
  state.orders.forEach(o=>{
    if(o.priceSnap===undefined){
      const p = getProduct(o.productId) || {};
      o.priceSnap = Number(o.price ?? p.price) || 0;
      o.materialSnap = Number(p.material)||0;
      o.packagingSnap = Number(p.packaging)||0;
      o.otherSnap = Number(p.other)||0;
      o.gatewayFeePctSnap = Number(state.assumptions.gatewayFeePct)||0;
      o.gstPctSnap = Number(state.assumptions.gstPct)||0;
      o.codFeePctSnap = Number(state.assumptions.codFeePct)||0;
      o.rtoMultiplierSnap = Number(state.assumptions.rtoMultiplier)||1;
      changed = true;
    }
  });
  return changed;
}

/* ================= HELPERS ================= */
function fmt(n,dec){
  n = Number(n)||0;
  const d = dec===undefined ? (Math.abs(n)<1000 && n%1!==0 ? 2 : 0) : dec;
  return '₹'+n.toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function pct(n){return (Number(n)*100).toLocaleString('en-IN',{maximumFractionDigits:1})+'%';}
function sum(arr){return arr.reduce((a,b)=>a+(Number(b)||0),0);}
function monthOf(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return '';
  return MONTHS[d.getMonth()]+'-'+d.getFullYear();
}
function monthKey(m){
  if(!m) return 0;
  const [mon,yr]=m.split('-');
  return parseInt(yr)*12+MONTHS.indexOf(mon);
}
function getProduct(id){return state.products.find(p=>p.id===id);}
function productCOGS(p){return (Number(p?.material)||0)+(Number(p?.packaging)||0)+(Number(p?.other)||0);}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ================= COMPUTE =================
   IMPORTANT: every order carries its own locked-in snapshot of price, COGS
   components and fee/GST/RTO rates, captured at the moment it was saved.
   computeOrder() ALWAYS uses those snapshot values (o.*Snap) — never the
   live Product Master or Settings values — so editing a product's cost or
   a fee % later on only affects orders you add or explicitly re-lock from
   now on. Past, already-saved orders keep the numbers they were recorded with. */
function computeOrder(o){
  const p = getProduct(o.productId) || {};
  const price = Number(o.priceSnap ?? p.price)||0;
  const qty = Number(o.qty)||0;
  const discount = Number(o.discount)||0;
  const shipping = Number(o.shipping)||0;
  const grossSale = qty*price - discount;
  const netRevenue = grossSale + shipping;
  const advance = o.paymentMode==='Prepaid' ? netRevenue : Number(o.advance ?? state.assumptions.defaultAdvance);
  const balanceDue = netRevenue - advance;
  const gwPct = (Number(o.gatewayFeePctSnap ?? state.assumptions.gatewayFeePct)||0)/100;
  const gstPct = (Number(o.gstPctSnap ?? state.assumptions.gstPct)||0)/100;
  const gatewayFeeBase = advance*gwPct;
  const gatewayFeeGST = gatewayFeeBase*gstPct;
  const gatewayFee = gatewayFeeBase+gatewayFeeGST;
  const codPct = (Number(o.codFeePctSnap ?? state.assumptions.codFeePct)||0)/100;
  const codFee = o.status==='Delivered' ? balanceDue*codPct : 0;
  const cogsUnit = (o.materialSnap!==undefined)
    ? (Number(o.materialSnap)||0)+(Number(o.packagingSnap)||0)+(Number(o.otherSnap)||0)
    : productCOGS(p);
  const totalCOGS = qty*cogsUnit;
  const courierRaw = Number(o.courierCost)||0;
  const isRTO = o.status==='RTO'||o.status==='Returned';
  const rtoMult = Number(o.rtoMultiplierSnap ?? state.assumptions.rtoMultiplier)||1;
  const courierEff = isRTO ? courierRaw*rtoMult : courierRaw;
  let grossProfit;
  if(o.status==='Cancelled'){ grossProfit = 0; }
  else if(isRTO){
    grossProfit = state.assumptions.refundAdvanceOnRTO
      ? -(totalCOGS+courierEff+gatewayFee)
      : advance-gatewayFee-totalCOGS-courierEff;
  } else {
    grossProfit = netRevenue-totalCOGS-gatewayFee-codFee-courierRaw;
  }
  const month = monthOf(o.date);
  return {...o, productName:p.name||'— deleted product —', price, grossSale, netRevenue, advance, balanceDue,
    gatewayFeeBase, gatewayFeeGST, gatewayFee, codFee, cogsUnit, totalCOGS, courierEff, grossProfit, month};
}

function dashboardRows(){
  const months = new Set();
  state.orders.forEach(o=>{const m=monthOf(o.date); if(m) months.add(m);});
  state.expenses.forEach(e=>{if(e.month) months.add(e.month);});
  const sorted=[...months].sort((a,b)=>monthKey(a)-monthKey(b));
  const rows = sorted.map(m=>{
    const ords = state.orders.filter(o=>monthOf(o.date)===m).map(computeOrder);
    const delivered = ords.filter(o=>o.status==='Delivered').length;
    const rto = ords.filter(o=>o.status==='RTO'||o.status==='Returned').length;
    const cancelled = ords.filter(o=>o.status==='Cancelled').length;
    const total = ords.length;
    const rtoRate = (delivered+rto)===0?0:rto/(delivered+rto);
    const grossSales = sum(ords.map(o=>o.grossSale));
    const netRevenue = sum(ords.map(o=>o.netRevenue));
    const totalCOGS = sum(ords.map(o=>o.totalCOGS));
    const grossProfit = sum(ords.map(o=>o.grossProfit));
    const exps = state.expenses.filter(e=>e.month===m);
    const marketing = sum(exps.filter(e=>e.category==='Marketing/Ads').map(e=>e.amount));
    const totalExpenses = sum(exps.map(e=>e.amount));
    const otherExpenses = totalExpenses-marketing;
    const netProfit = grossProfit-totalExpenses;
    const netMargin = netRevenue===0?0:netProfit/netRevenue;
    return {month:m,total,delivered,rto,cancelled,rtoRate,grossSales,netRevenue,totalCOGS,grossProfit,marketing,otherExpenses,totalExpenses,netProfit,netMargin,orders:ords,expensesList:exps};
  });
  return rows;
}

function productPerformanceRows(){
  return state.products.filter(p=>p.name).map(p=>{
    const ords = state.orders.filter(o=>o.productId===p.id).map(computeOrder);
    const totalOrders = ords.length;
    const deliveredUnits = sum(ords.filter(o=>o.status==='Delivered').map(o=>o.qty));
    const rtoOrders = ords.filter(o=>o.status==='RTO'||o.status==='Returned').length;
    const rtoRate = (deliveredUnits+rtoOrders)===0?0:rtoOrders/(deliveredUnits+rtoOrders);
    const netRevenueDelivered = sum(ords.filter(o=>o.status==='Delivered').map(o=>o.netRevenue));
    const totalCOGSDelivered = sum(ords.filter(o=>o.status==='Delivered').map(o=>o.totalCOGS));
    const netProfitAll = sum(ords.map(o=>o.grossProfit));
    const contribMargin = netRevenueDelivered===0?0:netProfitAll/netRevenueDelivered;
    const perf = totalOrders===0 ? 'Needs Attention' : (contribMargin>=0.2?'Good':contribMargin>=0.1?'Watch':'Needs Attention');
    return {...p,totalOrders,deliveredUnits,rtoOrders,rtoRate,netRevenueDelivered,totalCOGSDelivered,netProfitAll,contribMargin,perf};
  });
}

function inventoryRows(){
  let running=0;
  return state.inventory.map(r=>{
    const totalCost=(Number(r.qty)||0)*(Number(r.unitCost)||0);
    running+=totalCost;
    return {...r,totalCost,running};
  });
}
function bankRows(){
  let running=Number(state.bank.opening)||0;
  return state.bank.entries.map(r=>{
    running += (Number(r.in)||0)-(Number(r.out)||0);
    return {...r,running};
  });
}
function liveBalance(){
  const rows = bankRows();
  return rows.length ? rows[rows.length-1].running : (Number(state.bank.opening)||0);
}

let lastBalanceShown=null;
function animateBalance(){
  const el=document.getElementById('topBalance');
  const target=liveBalance();
  if(lastBalanceShown===null){el.textContent=fmt(target);lastBalanceShown=target;return;}
  const start=lastBalanceShown, dur=500, t0=performance.now();
  function step(t){
    const p=Math.min(1,(t-t0)/dur);
    el.textContent=fmt(start+(target-start)*p);
    if(p<1) requestAnimationFrame(step); else lastBalanceShown=target;
  }
  requestAnimationFrame(step);
}

/* ================= SHOPIFY CSV IMPORT =================
   Mapping used, per your workflow:
   - Name                -> Order ID (multiple line items sharing the same Name
                            become multiple order rows sharing that Order ID —
                            the app already sums profit across rows regardless
                            of Order ID, so multi-product orders total correctly).
   - Billing/Shipping Name -> Customer
   - Discount Amount     -> Discount (applied once, on the first line of an order,
                            so it isn't double-counted across line items)
   - Shipping            -> Shipping charged (also first line only)
   - Lineitem quantity   -> Qty
   - Lineitem price      -> Price (locked in as that order's price snapshot)
   - Lineitem name       -> matched to an existing Product Master entry by name;
                            if no match exists, a new product is auto-created
                            (COGS defaults to 0 — set it in Product Master after import)
   - Financial Status    -> Payment Mode:
       "paid"              -> Prepaid, full amount treated as advance
       "partially_paid"    -> COD, advance = Total − Outstanding Balance
       anything else / pending -> COD, advance = your default COD advance
                            (Settings), matching the ₹100-shipping-advance-then-
                            balance-on-delivery flow you described
   - New status "Unfulfilled" is added and every imported order defaults to it,
     whether or not it already shows as fulfilled/unfulfilled in Shopify —
     you then move it to In Transit / Delivered / RTO etc. from your own workflow.
   - Cost & fee rates are locked in (snapshotted) at import time, same as any
     other order, so later Product Master / Settings edits won't touch these. */
function ensureCsvLib(cb){
  if(window.Papa){ cb(); return; }
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js';
  s.onload = cb;
  s.onerror = ()=>toast('Could not load CSV parser — check your internet connection');
  document.head.appendChild(s);
}
function parseShopifyDate(s){
  if(!s || !s.trim()) return new Date().toISOString().slice(0,10);
  return s.trim().slice(0,10);
}
function findOrCreateProduct(lineName, linePrice){
  const name = (lineName||'').trim();
  if(!name) return null;
  let existing = state.products.find(x=>(x.name||'').trim().toLowerCase()===name.toLowerCase());
  if(existing) return {product:existing, isNew:false};
  const created = {id:uid(), name, price:Number(linePrice)||0, material:0, packaging:0, other:0, notes:'Auto-added from Shopify import — set its material/packaging/other cost here'};
  state.products.push(created);
  return {product:created, isNew:true};
}
function importShopifyOrders(csvText){
  ensureCsvLib(()=>{
    let parsed;
    try{ parsed = Papa.parse(csvText, {header:true, skipEmptyLines:true}); }
    catch(err){ toast('Could not read that CSV file'); return; }
    const rows = (parsed && parsed.data) || [];
    if(!rows.length || !('Name' in rows[0])){ toast('This doesn\'t look like a Shopify orders export'); return; }

    // group line-item rows by Order Name, preserving file order
    const groups = new Map();
    rows.forEach(row=>{
      const name = (row['Name']||'').trim();
      if(!name) return;
      if(!groups.has(name)) groups.set(name, []);
      groups.get(name).push(row);
    });

    const existingOrderIds = new Set(state.orders.map(o=>o.orderId));
    let importedOrders=0, importedLines=0, skipped=0;
    const newProductNames=[];

    groups.forEach((lineRows, name)=>{
      if(existingOrderIds.has(name)){ skipped++; return; }
      // order-level fields only appear on the first row of a multi-line Shopify order
      const head = lineRows.find(r=>(r['Financial Status']||'').trim()) || lineRows[0];
      const date = parseShopifyDate(head['Created at']);
      const customer = ((head['Shipping Name']||head['Billing Name']||'')).trim();
      const discount = Number(head['Discount Amount'])||0;
      const shipping = Number(head['Shipping'])||0;
      const total = Number(head['Total'])||Number(head['Subtotal'])||0;
      const outstandingRaw = head['Outstanding Balance'];
      const outstanding = (outstandingRaw!==undefined && outstandingRaw!=='') ? Number(outstandingRaw) : null;
      const finStatus = (head['Financial Status']||'').trim().toLowerCase();
      const wasCancelled = !!(head['Cancelled at'] && head['Cancelled at'].trim());

      let paymentMode, advanceTotal;
      if(finStatus==='paid'){
        paymentMode='Prepaid'; advanceTotal = total;
      } else if(finStatus==='partially_paid' && outstanding!==null){
        paymentMode='COD'; advanceTotal = Math.max(0, total-outstanding);
      } else if(finStatus==='refunded' || finStatus==='voided'){
        paymentMode='COD'; advanceTotal = 0;
      } else {
        paymentMode='COD'; advanceTotal = Number(state.assumptions.defaultAdvance)||0;
      }

      let lineIdx=0;
      lineRows.forEach(row=>{
        const lineName = row['Lineitem name'];
        if(!lineName || !lineName.trim()) return;
        const qty = Number(row['Lineitem quantity'])||1;
        const linePrice = Number(row['Lineitem price'])||0;
        const found = findOrCreateProduct(lineName, linePrice);
        if(!found) return;
        if(found.isNew) newProductNames.push(found.product.name);
        const isFirst = lineIdx===0;
        state.orders.push({
          id: uid(), date, orderId:name, customer, productId:found.product.id, qty,
          discount: isFirst?discount:0, shipping: isFirst?shipping:0,
          paymentMode, advance: isFirst?advanceTotal:0, courierCost:0,
          status: wasCancelled?'Cancelled':'Unfulfilled',
          priceSnap: linePrice,
          materialSnap: Number(found.product.material)||0,
          packagingSnap: Number(found.product.packaging)||0,
          otherSnap: Number(found.product.other)||0,
          gatewayFeePctSnap: Number(state.assumptions.gatewayFeePct)||0,
          gstPctSnap: Number(state.assumptions.gstPct)||0,
          codFeePctSnap: Number(state.assumptions.codFeePct)||0,
          rtoMultiplierSnap: Number(state.assumptions.rtoMultiplier)||1
        });
        importedLines++;
        lineIdx++;
      });
      if(lineIdx>0) importedOrders++;
    });

    renderAll();
    const uniqueNewProducts = [...new Set(newProductNames)];
    openModal(`
      <h3>Shopify import complete</h3>
      <div class="modal-sub">
        Imported <b>${importedOrders}</b> order${importedOrders===1?'':'s'} (${importedLines} line item${importedLines===1?'':'s'}).<br>
        ${skipped? `Skipped <b>${skipped}</b> order${skipped===1?'':'s'} already in your tracker (matched by Order ID) — re-running the same file is safe.<br>`:''}
        ${uniqueNewProducts.length? `Added <b>${uniqueNewProducts.length}</b> new product${uniqueNewProducts.length===1?'':'s'} to Product Master with cost set to ₹0 — open Product Master and fill in material/packaging/other cost:<br><i>${uniqueNewProducts.join(', ')}</i><br>`:''}
        All imported orders are marked <b>Unfulfilled</b>. Orders with 2–3 products together show up as multiple rows sharing the same Order ID in the Orders table.
      </div>
      <div class="modal-actions"><button class="btn primary" id="mDone">Done</button></div>
    `);
    document.getElementById('mDone').addEventListener('click',closeModal);
  });
}

  const cls = s==='Delivered'?'delivered':(s==='RTO'||s==='Returned')?'rto':s==='Cancelled'?'cancelled':s==='Unfulfilled'?'unfulfilled':'transit';
  return `<span class="badge ${cls}">${s||'Unfulfilled'}</span>`;
}

  if(o.status==='In Transit'||o.status==='Unfulfilled') return 'var(--ochre)';

}

function orderModal(id){

      <button class="btn primary" id="mSave">${editing?'Save changes':'Add order'}</button>
    </div>
  `);
  document.getElementById('f_mode').addEventListener('change',e=>{
    const adv=document.getElementById('f_advance');
    if(e.target.value==='Prepaid'){adv.disabled=true;} else {adv.disabled=false; if(!adv.value) adv.value=state.assumptions.defaultAdvance;}
  });
  document.getElementById('mCancel').addEventListener('click',closeModal);
  document.getElementById('mSave').addEventListener('click',()=>{
    const newProductId = document.getElementById('f_product').value;
    const productChanged = !editing || newProductId !== editing.productId;
    const rec = {
      id: editing?editing.id:uid(),
      date: document.getElementById('f_date').value,
      orderId: document.getElementById('f_orderId').value||nextOrderId(),
      customer: document.getElementById('f_customer').value,
      productId: newProductId,
      qty: Number(document.getElementById('f_qty').value)||1,
      discount: Number(document.getElementById('f_discount').value)||0,
      shipping: Number(document.getElementById('f_shipping').value)||0,
      paymentMode: document.getElementById('f_mode').value,
      advance: Number(document.getElementById('f_advance').value)||0,
      courierCost: Number(document.getElementById('f_courier').value)||0,
      status: document.getElementById('f_status').value
    };
    if(editing && !productChanged){
      // keep this order's original locked-in cost & fee snapshot untouched
      rec.priceSnap = editing.priceSnap;
      rec.materialSnap = editing.materialSnap;
      rec.packagingSnap = editing.packagingSnap;
      rec.otherSnap = editing.otherSnap;
      rec.gatewayFeePctSnap = editing.gatewayFeePctSnap;
      rec.gstPctSnap = editing.gstPctSnap;
      rec.codFeePctSnap = editing.codFeePctSnap;
      rec.rtoMultiplierSnap = editing.rtoMultiplierSnap;
    } else {
      // new order, or product was switched: lock in today's product cost & today's fee rates
      const p = getProduct(newProductId) || {};
      rec.priceSnap = Number(p.price)||0;
      rec.materialSnap = Number(p.material)||0;
      rec.packagingSnap = Number(p.packaging)||0;
      rec.otherSnap = Number(p.other)||0;
      rec.gatewayFeePctSnap = Number(state.assumptions.gatewayFeePct)||0;
      rec.gstPctSnap = Number(state.assumptions.gstPct)||0;
      rec.codFeePctSnap = Number(state.assumptions.codFeePct)||0;
      rec.rtoMultiplierSnap = Number(state.assumptions.rtoMultiplier)||1;
    }
    if(editing){ state.orders = state.orders.map(o=>o.id===editing.id?rec:o); toast('Order updated'); }
    else { state.orders.push(rec); toast('Order added'); }
    closeModal(); renderAll();
  });
}

/* ================= SETTINGS ================= */
function renderSettings(c){
  const a = state.assumptions;
  const eff = (Number(a.gatewayFeePct)*(1+Number(a.gstPct)/100)).toFixed(3);
  const syncStatusHtml = !SYNC_ENABLED
    ? `<div class="callout">Cloud sync isn't set up yet — data is only auto-saving in this browser. Open the code and fill in <b>FIREBASE_CONFIG</b> near the top of the script (see the setup notes just above it) to enable free phone ⇄ laptop sync.</div>`
    : syncKey
      ? `<div class="callout sage">Cloud sync is on for this device.</div>
         <div class="modal-actions" style="margin-top:10px;">
           <button class="btn" id="s_showKey">Show / copy sync code</button>
           <button class="btn danger" id="s_changeKey">Use a different code</button>
         </div>`
      : `<div class="callout">Cloud sync is available but not linked on this device yet.</div>
         <div class="modal-actions" style="margin-top:10px;"><button class="btn primary" id="s_setup">Set up sync</button></div>`;
  c.innerHTML = `
    <div class="section-head"><div><h2>Settings &amp; Assumptions</h2><p>These drive calculations for <b>new orders only</b> — orders already saved keep the rates they were recorded with (see the ↻ icon on the Orders tab if you ever want to pull a specific past order up to today's rates).</p></div></div>
    <div class="card" style="margin-bottom:20px;">
      <div class="section-head" style="margin-bottom:8px;"><div><h3 style="font-family:var(--font-display);font-size:16px;margin:0;">Cloud Sync</h3></div></div>
      ${syncStatusHtml}
    </div>
    <div class="callout sage"><b>How this works now:</b> the payment-gateway fee (${a.gatewayFeePct}% base + ${a.gstPct}% GST on that fee, effective <b>${eff}%</b>), COD fee and RTO multiplier below apply to orders from the moment you save them. Changing a number here does <b>not</b> retroactively change orders you already logged.</div>
    <div class="card">
      <div class="assump-grid">
        <div class="field"><label>Gateway fee % (on advance/prepaid)</label><input type="number" step="0.01" id="a_gw" value="${a.gatewayFeePct}"></div>
        <div class="field"><label>GST % on that gateway fee</label><input type="number" step="0.01" id="a_gst" value="${a.gstPct}"></div>
        <div class="field"><label>COD handling fee % (on balance)</label><input type="number" step="0.01" id="a_cod" value="${a.codFeePct}"></div>
        <div class="field"><label>RTO shipping multiplier (there+back)</label><input type="number" step="0.1" id="a_rto" value="${a.rtoMultiplier}"></div>
        <div class="field"><label>Default COD advance (₹)</label><input type="number" id="a_adv" value="${a.defaultAdvance}"></div>
        <div class="field"><label>Refund advance on RTO?</label><select id="a_refund">
          <option value="no" ${!a.refundAdvanceOnRTO?'selected':''}>No (recommended — keep as consolation)</option>
          <option value="yes" ${a.refundAdvanceOnRTO?'selected':''}>Yes (refund in full)</option>
        </select></div>
      </div>
      <div class="hint">Effective gateway rate for orders saved from now on: <b>${eff}%</b> of every advance / prepaid amount collected.</div>
      <div class="modal-actions" style="margin-top:18px;">
        <button class="btn" id="a_reset">Reset to demo data</button>
        <button class="btn danger" id="a_clear">Clear all data</button>
        <button class="btn primary" id="a_save">Save assumptions</button>
      </div>
    </div>
  `;
  const setupBtn = document.getElementById('s_setup');
  if(setupBtn) setupBtn.addEventListener('click',askSyncSetup);
  const showKeyBtn = document.getElementById('s_showKey');
  if(showKeyBtn) showKeyBtn.addEventListener('click',()=>showSyncKey(syncKey));
  const changeKeyBtn = document.getElementById('s_changeKey');
  if(changeKeyBtn) changeKeyBtn.addEventListener('click',()=>{
    if(confirm('This device will stop syncing with the current code. You can then create or enter a new code. Continue?')){
      localStorage.removeItem('lilstep_sync_key');
      syncKey = null; syncDocRef = null;
      askSyncSetup();
    }
  });
  document.getElementById('a_save').addEventListener('click',()=>{
    state.assumptions = {
      gatewayFeePct: Number(document.getElementById('a_gw').value)||0,
      gstPct: Number(document.getElementById('a_gst').value)||0,
      codFeePct: Number(document.getElementById('a_cod').value)||0,
      rtoMultiplier: Number(document.getElementById('a_rto').value)||1,
      defaultAdvance: Number(document.getElementById('a_adv').value)||0,
      refundAdvanceOnRTO: document.getElementById('a_refund').value==='yes'
    };
    toast('Assumptions saved — this applies to new orders from now on'); renderAll();
  });
  document.getElementById('a_reset').addEventListener('click',()=>{
    if(confirm('Replace current data with the demo dataset?')){state=seedState(); toast('Demo data restored'); renderAll();}
  });
  document.getElementById('a_clear').addEventListener('click',()=>{
    if(confirm('This clears every product, order, purchase, bank entry and expense. Continue?')){
      state = {products:[],orders:[],inventory:[],bank:{opening:0,entries:[]},expenses:[],assumptions:state.assumptions};
      toast('All data cleared'); renderAll();
    }
  });
}

/* ================= CLOUD SYNC (free, via Firebase) =================
   Setup (one-time, ~10 min, no cost):
   1. Go to https://console.firebase.google.com, create a free project.
   2. In that project, click "Firestore Database" → Create database → Production mode → pick a location.
   3. In Firestore → Rules tab, replace the rules with:
        rules_version = '2';
        service cloud.firestore {
          match /databases/{database}/documents {
            match /trackers/{trackerId} { allow read, write: if true; }
          }
        }
      (This keeps it free/open — your data is protected only by your private sync code below,
       so never share that code publicly.)
   4. In Project settings (gear icon) → General → "Your apps" → Add app → Web (</>) → register it.
   5. Copy the apiKey, authDomain and projectId it gives you into FIREBASE_CONFIG right below.
   6. Re-open this file in the browser — it'll prompt you to "Create new sync code" once.
      Enter that same code on your other device to link it.
   Until you fill this in, the tracker still auto-saves locally to this browser only. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAn0vRck6xV2ZAFxZjiEp74Prfos6hfHDM",
  authDomain: "lilstep-tracker.firebaseapp.com",
  projectId: "lilstep-tracker"
};
const SYNC_ENABLED = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId && typeof firebase!=='undefined');
const CLIENT_ID = uid();
let db=null, syncDocRef=null, syncKey=localStorage.getItem('lilstep_sync_key')||null;
let applyingRemote=false, saveTimer=null;

function persist(){
  try{ localStorage.setItem('lilstep_state', JSON.stringify(state)); }catch(e){}
  queueCloudSave();
}
function queueCloudSave(){
  if(!db || !syncDocRef || applyingRemote) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushToCloud, 1200);
}
function pushToCloud(){
  if(!db || !syncDocRef) return;
  syncDocRef.set({state, _writer:CLIENT_ID, _updatedAt:Date.now()}).catch(e=>console.warn('Cloud save failed', e));
}
function initSync(){
  if(!SYNC_ENABLED) return;
  try{ firebase.initializeApp(FIREBASE_CONFIG); db = firebase.firestore(); }
  catch(e){ console.warn('Firebase init failed', e); return; }
  if(!syncKey) askSyncSetup();
  else connectSync(syncKey);
}
function connectSync(key, isNew){
  if(!db) return;
  syncKey = key;
  syncDocRef = db.collection('trackers').doc(key);
  syncDocRef.onSnapshot(snap=>{
    if(!snap.exists){ if(isNew) pushToCloud(); return; }
    const data = snap.data();
    if(data._writer===CLIENT_ID) return; // ignore echo of our own write
    if(data.state){
      applyingRemote = true;
      state = data.state;
      migrateOrderSnapshots();
      try{ localStorage.setItem('lilstep_state', JSON.stringify(state)); }catch(e){}
      renderAll();
      applyingRemote = false;
      toast('Synced from your other device');
    }
  }, err=>console.warn('Sync listener error', err));
}
function askSyncSetup(){
  openModal(`
    <h3>Turn on cloud sync</h3>
    <div class="modal-sub">Link this tracker to your phone and laptop so both always show the same data — free.</div>
    <div class="form-grid">
      <div class="field full"><button class="btn primary" id="syncCreate" style="width:100%;justify-content:center;">Create new sync code (first device)</button></div>
      <div class="field full"><label>Or paste a code from your other device</label><input type="text" id="syncInput" placeholder="Paste sync code here"></div>
    </div>
    <div class="modal-actions"><button class="btn ghost" id="syncSkip">Not now</button><button class="btn primary" id="syncJoin">Connect with this code</button></div>
  `);
  document.getElementById('syncSkip').addEventListener('click',closeModal);
  document.getElementById('syncCreate').addEventListener('click',()=>{
    const key = uid()+uid();
    localStorage.setItem('lilstep_sync_key', key);
    connectSync(key, true);
    closeModal();
    showSyncKey(key);
  });
  document.getElementById('syncJoin').addEventListener('click',()=>{
    const key = document.getElementById('syncInput').value.trim();
    if(!key){ toast('Paste a sync code first'); return; }
    localStorage.setItem('lilstep_sync_key', key);
    connectSync(key, false);
    closeModal();
  });
}
function showSyncKey(key){
  openModal(`
    <h3>Your sync code</h3>
    <div class="modal-sub">Copy this and paste it into "Or paste a code from your other device" when you open this same file on your phone/laptop. Keep it private — anyone with this code can see and edit this data.</div>
    <div class="field full"><input type="text" id="syncKeyBox" value="${key}" readonly style="font-family:var(--font-mono);"></div>
    <div class="modal-actions"><button class="btn primary" id="syncCopy">Copy code</button><button class="btn ghost" id="syncDone">Done</button></div>
  `);
  document.getElementById('syncCopy').addEventListener('click',()=>{
    navigator.clipboard.writeText(key).then(()=>toast('Copied'));
  });
  document.getElementById('syncDone').addEventListener('click',closeModal);
}
function boot(){
  try{ const local = localStorage.getItem('lilstep_state'); if(local) state = JSON.parse(local); }catch(e){}
  migrateOrderSnapshots();
  renderAll();
  initSync();
}

/* ================= EXPORT / IMPORT ================= */
document.getElementById('btnExport').addEventListener('click',()=>{
  const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='lilstep-finance-data.json'; a.click();
  URL.revokeObjectURL(url);
  toast('Exported — save this file to keep your data');
});
document.getElementById('btnImport').addEventListener('click',()=>document.getElementById('fileImport').click());
document.getElementById('fileImport').addEventListener('change',e=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(!data.products || !data.orders) throw new Error('bad shape');
      state = data;
      migrateOrderSnapshots();
      toast('Data imported'); renderAll();
    }catch(err){ toast('Could not read that file'); }
  };
  reader.readAsText(file);
  e.target.value='';
});

/* ================= INIT ================= */
boot();
</script>
